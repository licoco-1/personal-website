# 头像与图标的旧文件清理：站点设置保存后，只保留 src/data/site.yml 当前引用的文件，其余从仓库删除
name: Cleanup uploads

on:
  push:
    branches: [main]
    paths:
      - 'src/data/site.yml'
      - 'public/uploads/**'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 删除未被引用的文件
        run: |
          set -euo pipefail
          for field in avatar favicon; do
            dir="public/uploads/$field"
            [ -d "$dir" ] || continue
            # 取出该字段在 site.yml 里的引用路径并解码，避免中文文件名被 URL 编码后比对失败
            ref=$(sed -nE "s/^$field:[[:space:]]*//p" src/data/site.yml | head -1 | sed -e "s/^['\"]//" -e "s/['\"]$//" | tr -d '\r' | python3 -c "import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))")
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              if [ "/uploads/$field/$(basename "$file")" != "$ref" ]; then
                git rm -q "$file"
              fi
            done
          done
      - name: 提交清理结果
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove unreferenced uploads"
            git push
          fi
