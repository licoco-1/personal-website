# 站点设置
# 可以直接编辑本文件，也可以在 /admin/ 后台的「站点设置」中修改。

# 浏览器标题与导航左侧显示的站点名
title: 面包房

# 首页主视觉左侧的竖排标题（每行一项）
heroTitleLines:
  - my
  - artworks

# 画师信息
artist: 画师昵称
handle: bakery_demo
bio: 这里填写一句话简介，例如创作方向、接稿范围、更新频率等。

# 头像与浏览器标签页图标（在后台「站点设置」中上传，留空则使用主题自带文件）
avatar: ''
favicon: ''

# 关于页的自我介绍，每段一行
aboutIntro: |
  这里填写画师的自我介绍：创作方向、常用工具、接稿范围与流程等。
  工作联系请通过邮件沟通；如果喜欢这里的作品，也欢迎在赞助页支持创作。
  本站的每一件作品都可以点进详情页，按顺序看完该作品的全部图片。

# 邮箱与赞助页链接（FANBOX、爱发电等），留空则不在页面上显示
email: hello@example.com
supportUrl: https://www.fanbox.cc/

# 首页主视觉轮播展示的最新作品数量
heroCount: 5

# 顶部导航菜单（站内路径）
nav:
  - label: HOME
    href: /
  - label: ABOUT
    href: /about/

# 首页主视觉与画师栏展示的社交链接，icon 可选：x / pixiv / instagram / mail
links:
  - label: X
    href: https://x.com/your_name
    icon: x
  - label: pixiv
    href: https://www.pixiv.net/
    icon: pixiv
  - label: Instagram
    href: https://www.instagram.com/
    icon: instagram
  - label: Email
    href: mailto:hello@example.com
    icon: mail
